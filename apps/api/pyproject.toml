[project]
name = "milpbooklm-api"
version = "0.1.0"
description = "FastAPI composition root and HTTP/SSE routes (skeleton: no framework deps yet)."
requires-python = ">=3.13,<3.14"
dependencies = [
    "milpbooklm-domain",
    "milpbooklm-application",
    "milpbooklm-adapters",
    "milpbooklm-contracts",
    # REFERENCE-DEPENDENCIES.md "API" row: FastAPI, Pydantic v2, Uvicorn.
    # Pydantic v2 is the typed configuration loader (ch04: typed config at startup).
    "pydantic>=2.10,<3",
    # Capability registry (packages/contracts/capabilities.yaml) is YAML data;
    # tools/spec parse it and validate both registries against JSON Schemas.
    "PyYAML>=6.0.2,<7",
    "jsonschema>=4.23,<5",
]

[tool.uv.sources]
milpbooklm-domain = { workspace = true }
milpbooklm-application = { workspace = true }
milpbooklm-adapters = { workspace = true }
milpbooklm-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/milpbooklm_api"]
