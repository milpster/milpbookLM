[project]
name = "milpbooklm-application"
version = "0.1.0"
description = "Use cases and ports. Depends on domain only."
requires-python = ">=3.13,<3.14"
dependencies = [
    "milpbooklm-domain",
]

[tool.uv.sources]
milpbooklm-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/milpbooklm_application"]
