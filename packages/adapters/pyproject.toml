[project]
name = "milpbooklm-adapters"
version = "0.1.0"
description = "Adapters (PostgreSQL, blobs, models, parsers, SearXNG, Playwright). Depends on application + domain."
requires-python = ">=3.13,<3.14"
dependencies = [
    "milpbooklm-domain",
    "milpbooklm-application",
    # REFERENCE-DEPENDENCIES: "SQLAlchemy 2, Alembic, psycopg 3" (persistence line)
    "sqlalchemy>=2.0,<3",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    # FND-03: property tests over domain invariants (ch05 "Tests")
    "hypothesis>=6.130",
]

[tool.uv.sources]
milpbooklm-domain = { workspace = true }
milpbooklm-application = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/milpbooklm_adapters"]
