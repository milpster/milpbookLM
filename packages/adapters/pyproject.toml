[project]
name = "milpbooklm-adapters"
version = "0.1.0"
description = "Adapters (PostgreSQL, blobs, models, parsers, SearXNG, Playwright). Depends on application + domain."
requires-python = ">=3.13,<3.14"
dependencies = [
    "milpbooklm-domain",
    "milpbooklm-application",
    "milpbooklm-contracts",
    # REFERENCE-DEPENDENCIES: "SQLAlchemy 2, Alembic, psycopg 3" (persistence line)
    "sqlalchemy>=2.0,<3",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    # Authorized dedicated provider transport (REFERENCE-DEPENDENCIES HTTP row);
    # anyio is the httpx/httpcore async backend these transports run on.
    "httpx>=0.28,<1",
    "anyio>=4.10,<5",
    "pydantic>=2.11,<3",
    # REFERENCE-DEPENDENCIES security row: argon2-cffi; Argon2id params calibrated at
    # install/upgrade and stored with each hash (FND-04).
    "argon2-cffi>=25.1,<26",
    "pynacl==1.6.2",
    # REFERENCE-DEPENDENCIES parser matrix: PDF extraction chain.
    "pypdf>=6.0,<7",
    "pdfplumber>=0.11,<1",
    # REFERENCE-DEPENDENCIES parser matrix (ING-02a office rows): XLSX
    # "openpyxl read-only/data-only", DOCX "python-docx", PPTX "python-pptx".
    "openpyxl>=3.1,<4",
    "python-docx>=1.1,<2",
    "python-pptx>=1.0,<2",
    "ebooklib>=0.18,<0.20",
    "lxml>=5.0,<7",
    "selectolax>=0.3,<1",
    # REFERENCE-DEPENDENCIES parser matrix (ING-02c Images/OCR row): bounded
    # metadata/normalization BEFORE decode; Tesseract runs as isolated CLI.
    "pillow>=12.0,<13",
]

[dependency-groups]
dev = [
    # FND-03: property tests over domain invariants (ch05 "Tests")
    "hypothesis>=6.130",
]

[tool.uv.sources]
milpbooklm-domain = { workspace = true }
milpbooklm-application = { workspace = true }
milpbooklm-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/milpbooklm_adapters"]
