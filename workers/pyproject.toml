[project]
name = "milpbooklm-workers"
version = "0.1.0"
description = "Job runners grouped by queue class (skeleton)."
requires-python = ">=3.13,<3.14"
dependencies = [
    "milpbooklm-domain",
    "milpbooklm-application",
    "milpbooklm-adapters",
    # MOD-01 inference orchestrator: anyio primitives (Lock/Condition/open_process).
    "anyio>=4.10,<5",
]

[tool.uv.sources]
milpbooklm-domain = { workspace = true }
milpbooklm-application = { workspace = true }
milpbooklm-adapters = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/milpbooklm_workers"]
