# FND-03 Alembic configuration (FND-03 micro-index 3.2.2: app/migration env split).
# The DSN is provided via MILPBOOKLM_DB_URL (see env.py) - never stored here.
# DDL must run as the privileged migration role; env.py refuses the app role.
[alembic]
script_location = %(here)s
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
